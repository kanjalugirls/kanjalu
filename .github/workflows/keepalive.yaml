name: keep-supabase-awake

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Supabase for one row
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$URL/rest/v1/site_content?select=key&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"
